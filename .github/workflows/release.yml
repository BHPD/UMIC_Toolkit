name: Build Windows executable

# Builds the UMIC Toolkit .exe with PyInstaller (build.spec) and attaches the
# zipped build folder to the GitHub release. Can also be run manually from the
# Actions tab; the build is then available as a workflow artifact.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to upload assets to the release

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      UMIC_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Check that all toolkit modules import
        run: |
          python -c "import importlib, main; [getattr(importlib.import_module(m), c) for _, m, c, _ in main.MODULES]; print('modules OK')"

      - name: Build executable
        run: pyinstaller build.spec --clean --noconfirm

      - name: Package
        shell: pwsh
        run: |
          $name = "UMIC Toolkit $env:UMIC_VERSION"
          Copy-Item README.md, Changelog.md "dist/$name/"
          Copy-Item LICENSE "dist/$name/LICENSE.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "UMIC_Toolkit_${env:UMIC_VERSION}_windows.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UMIC_Toolkit_${{ env.UMIC_VERSION }}_windows
          path: UMIC_Toolkit_${{ env.UMIC_VERSION }}_windows.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "UMIC_Toolkit_${{ env.UMIC_VERSION }}_windows.zip" --clobber
