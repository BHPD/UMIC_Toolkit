[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "umic-toolkit"
dynamic = ["version"]
description = "GUI toolkit for UMIC microscopy workflows: Velox EMD conversion and biomero-converter image conversion"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "B.H.P. Duinkerken" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "customtkinter>=5.2",
    "hyperspy>=2.0",
    "rosettasciio>=0.4",
    "python-box>=7",
    "ome-types>=0.5",
    "tifffile>=2024.1",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# biomero-converter module (OME-Zarr / OME-TIFF conversion)
biomero_converter = ["biomero-converter>=0.2.5"]  # 0.2.4: PyInstaller hook; 0.2.5: DEFAULT_OUTPUT_FORMAT
# Building the Windows executable (pyinstaller build.spec)
build = ["pyinstaller>=6.10"]

[project.urls]
Repository = "https://github.com/BHPD/UMIC_Toolkit"

[project.scripts]
umic-toolkit = "main:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["modules*", "assets*"]

[tool.setuptools.package-data]
"*" = ["*.txt"]

[tool.setuptools.dynamic]
version = { attr = "main.__version__" }
